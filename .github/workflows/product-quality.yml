name: Product quality checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'integrations/**'
      - 'tests/**'
      - 'scripts/check-quality.cjs'
      - '.github/workflows/product-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run offline regression suite
        run: node scripts/check-quality.cjs
